name: oracle-ci

# Least-privilege: read-only; this job runs the portable oracle and selected
# Torch-dependent public evidence tests.
permissions:
  contents: read

# Python multi-version automation is on hold: use only Python 3.12.
# OS-specific native gates remain; do not add a Python version matrix.

# Gates the PORTABLE, pure-Python part of the oracle suite (oracle/kdm6 — the f64
# algorithm-definition / parity reference) so an oracle refactor can't drift its values
# without CI catching it. On this Python-only runner the pure-Python subset runs; the remainder SKIP by
# design and are gated elsewhere (so this job does NOT claim the full suite):
#   - test_cpp_parity (oracle↔C++ forward parity) and test_cpp_conservative_interface_parity
#     (conservative-interface oracle cross-check) need the built C++ port — they are gated by
#     port-ci (ci.yml), which builds libtorch and runs them after ctest.
#   - test_rttov_runner needs a local RTTOV reference dataset not shipped in this public repo.
# `-rs` prints the skip reasons so the pass/skip split is visible in the log. torch pinned to
# the ENVIRONMENT.md reference (2.8.0); rttov_bridge is pure Python (no RTTOV .so).

on:
  push:
    branches: [main]
    paths:
      - 'oracle/**'
      - 'harness/evidence/**'
      - 'harness/ice_chain_applied_budget.py'
      - 'harness/tests/test_ice_chain_applied_budget.py'
      - 'harness/oracle_evidence_suites.json'
      - 'harness/run_oracle_evidence_suites.py'
      - 'harness/tests/test_run_oracle_evidence_suites.py'
      - 'harness/ci_diagnostics/**'
      - '.github/requirements/oracle-*.txt'
      - '.github/workflows/oracle-ci.yml'
  # No paths filter on pull_request: "oracle pytest (f64 reference)" is a
  # REQUIRED status check in the main ruleset, so it must REPORT on every PR
  # to main. Path-filtering it (oracle/** only) left non-oracle PRs blocked
  # forever — GitHub waits for a required context that never runs, and a
  # manual workflow_dispatch run is not credited to the PR merge-box. The job
  # must run on all PRs so the required status can be reported. (push stays oracle/evidence-scoped — post-merge only.)
  pull_request:
    branches: [main, research/east_ice_radius_floor_packet]
  workflow_dispatch:

# Superseded PR runs have no remaining merge evidence value. Keep every main run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  oracle-pytest:
    name: oracle pytest (f64 reference)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            .github/requirements/oracle-torch-cpu.txt
            .github/requirements/oracle-pypi.txt

      - name: Install torch (CPU, pinned) + oracle verification dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/requirements/oracle-torch-cpu.txt
          # Keep numeric dependencies pinned while moving the single CI interpreter
          # to Python 3.12; this interpreter change needs its own green run.
          # Exercise synthetic NetCDF ingestion/identity tests in CI, not only locally.
          pip install -r .github/requirements/oracle-pypi.txt

      - name: Record versions
        run: |
          python -c 'import sys, torch, numpy, pytest, netCDF4, pyproj; print("python", sys.version.split()[0], "| torch", torch.__version__, "| numpy", numpy.__version__, "| pytest", pytest.__version__, "| netCDF4", netCDF4.__version__, "| pyproj", pyproj.__version__)'
          pip --version   # installer version (deps are pinned; pip itself is not)

      # The mandatory pyproj import above prevents importorskip from hiding the
      # independent LCC check. Run that test once, inside the complete suite.
      - name: Validate Oracle profiler
        run: python -m unittest discover -s harness/ci_diagnostics -p test_profile_pytest.py -v

      - name: pytest (oracle/, pure-Python subset)
        run: |
          cd oracle
          python ../harness/ci_diagnostics/profile_pytest.py \
            --output "$RUNNER_TEMP/oracle-pytest-profile.json" \
            --durations 30 -- python -m pytest -rs -q

      # The NumPy-only harness job intentionally has no Torch. Exercise the
      # native batch graph/checkpoint boundaries here, where Torch is mandatory.
      # These use an independent Torch backend and a mock RTTOV, not private assets.
      - name: pytest (native batch first-order boundaries)
        run: python -m pytest -rs -q
          harness/tests/test_native_batch_microphysics.py
          harness/tests/test_native_observation_batch.py
          harness/tests/test_native_checkpoint_observation.py
          harness/tests/test_run_native_satellite_case.py
          harness/tests/test_native_satellite_replay.py
          harness/tests/test_prepare_native_satellite_case.py
          harness/tests/test_ice_chain_applied_budget.py

      # These public evidence suites live outside harness/tests and depend
      # on Torch + NumPy + netCDF4. Keep separate discovery processes because
      # multiple directories contain test_replay.py. No private host/RTTOV is used.
      - name: Validate evidence runner
        run: python -m unittest discover -s harness/tests -p test_run_oracle_evidence_suites.py -v

      - name: unittest (QNICE evidence, normal)
        run: python harness/run_oracle_evidence_suites.py --mode normal --output "$RUNNER_TEMP/oracle-evidence-normal.json"

      # The tests launch child Python CLIs. Propagate optimization to them too.
      - name: unittest (QNICE evidence, optimized)
        env:
          PYTHONOPTIMIZE: '1'
        run: python harness/run_oracle_evidence_suites.py --mode optimized --output "$RUNNER_TEMP/oracle-evidence-optimized.json"

      - name: Upload evidence timings and Oracle profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-evidence-timings-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/oracle-evidence-*.json
            ${{ runner.temp }}/oracle-pytest-profile.json
          if-no-files-found: warn
          retention-days: 14
