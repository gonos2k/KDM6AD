name: g33-harness-ci

# Least-privilege: read-only; runs the G3.3-M evidence-system regression suite.
permissions:
  contents: read

# ADVISORY. This job runs the harness suite (which compiles the C++ probes),
# ruff's undefined-name family and the overlay 4-check on every PR, but it is
# NOT in the branch ruleset's required contexts: it reports, it does not block.
# It is not folded into port-ci's required build job either -- that job SKIPS
# when the port is untouched, which is exactly the PR where the harness suite
# matters most.
on:
  push:
    branches: [main]
    paths:
      - 'harness/**'
      - 'docs/C4_G3_3_OP_PROVENANCE_PROTOCOL.md'
      - '.github/workflows/g33-harness-ci.yml'
  # No paths filter on pull_request: a harness defect can be introduced by a PR
  # that edits no harness file, and the suite is a ~1-2 min pytest plus clang
  # probe builds. Reporting on every PR costs little and is the whole reason an
  # advisory job is worth having. (push stays harness-scoped -- post-merge only.)
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  g33-harness:
    name: g33 harness (op-provenance regression)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install numpy + pytest + netCDF4 (pinned)
        run: |
          python -m pip install --upgrade pip
          # numpy is used by the derived-flag comparator and the self-check;
          # pinned to the same combo as oracle-ci for reproducible float behavior.
          # ruff runs the undefined-name family over the whole harness.
          # Exercise synthetic NetCDF ingestion/identity tests in CI, not only locally.
          pip install "numpy==2.4.6" "pytest==9.1.1" "netCDF4==1.7.4" "ruff==0.14.4"

      - name: Record versions
        run: |
          python -c 'import sys, numpy, pytest, netCDF4; print("python", sys.version.split()[0], "| numpy", numpy.__version__, "| pytest", pytest.__version__, "| netCDF4", netCDF4.__version__)'
          # ruff is pinned like the others, so it is recorded like the others --
          # otherwise the run that found something cannot say which version did.
          python -m ruff --version
          c++ --version | head -1   # the C++ probes are compiled by the suite

      - name: undefined-name family (ruff F821/F822/F823, whole harness)
        # F821 is an undefined name, F822 an __all__ export naming nothing, F823
        # a local read before its own assignment (UnboundLocalError at runtime).
        #
        # --isolated ignores any pyproject/ruff.toml that appears later and
        # could narrow the selection or exclude paths; --no-respect-gitignore
        # keeps an ignored-but-tracked file in scope. The step claims "whole
        # harness", so it should not be a configuration file away from meaning
        # something smaller (owner review P1-C2).
        run: >
          python -m ruff --isolated check
          --select F821,F822,F823
          --no-cache
          --no-respect-gitignore
          harness/

      - name: pytest (harness/tests — container, comparator, overlay, probes)
        run: python -m pytest -rs -q harness/tests

      - name: overlay 4-check (all instrumented TUs)
        run: python harness/g33_overlay/verify_overlay.py

      # NOTE: the G3.3-M Fortran leg (harness/g33_fortran/) is LOCAL-ONLY — the
      # reference host WRF/KIM-meso Fortran tree is gitignored (not distributed),
      # so it cannot run in CI. It is exercised by test_g33_fortran_build.py,
      # which SKIPS when gfortran or the reference source is absent (i.e. always
      # in CI) and builds+runs where the source is present (the owner's host).
