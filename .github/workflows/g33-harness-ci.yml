name: g33-harness-ci

# Least-privilege: read-only; runs the G3.3-M evidence-system regression suite.
permissions:
  contents: read

# The G3.3-M evidence system lives almost entirely in harness/, but no required
# check ran it — oracle-ci only runs `cd oracle && pytest`, and port-ci's path
# filter has no harness/**. So "216 pass" was LOCAL evidence, never GitHub CI
# evidence: the very system that certifies op-provenance had no continuous
# regression gate. This job closes that. It compiles the C++ probes (via the
# pytest suite) and runs the overlay 4-check, so a drift in the container
# format, the derived-flag authority, or the overlay projection fails on the PR.
on:
  push:
    branches: [main]
    paths:
      - 'harness/**'
      - 'docs/C4_G3_3_OP_PROVENANCE_PROTOCOL.md'
      - '.github/workflows/g33-harness-ci.yml'
  # No paths filter on pull_request: to be a REQUIRED status check it must
  # REPORT on every PR to main (a path-filtered required context leaves
  # non-harness PRs blocked forever, waiting on a job that never runs). The
  # suite is a ~1-2 min pure-Python pytest plus clang probe builds; running it
  # on all PRs is cheap and keeps the gate always satisfiable. (push stays
  # harness-scoped — post-merge only.)
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  g33-harness:
    name: g33 harness (op-provenance regression)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The evidence-index tests check that an artifact's producer and verifier
          # commits are commits IN THIS REPOSITORY. A shallow clone cannot see a
          # commit that is genuinely present, so with the default fetch-depth those
          # checks skip and the membership half of the lineage goes unverified in
          # public CI (owner review §11). This job is cheap; the full history is
          # the price of the check actually running here.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install numpy + pytest (pinned)
        run: |
          python -m pip install --upgrade pip
          # numpy is used by the derived-flag comparator and the self-check;
          # pinned to the same combo as oracle-ci for reproducible float behavior.
          # pyyaml validates CLAIMS.yaml against a REAL YAML reader. The
          # registry is read by a hand-written regex parser, so without this
          # the file can become unparseable while every test stays green --
          # which happened (Codex).
          # ruff runs F821 (undefined name) over the whole harness. The
          # hand-written AST check in test_g33_static_and_smoke.py caught the
          # NameError that shipped, and misses a lambda body, a class scope and
          # a comprehension target that leaks -- measured, all three. This is
          # the checker that does not, and it needs no private source or data
          # (owner review 10).
          pip install "numpy==2.4.6" "pytest==9.1.1" "pyyaml==6.0.2" "ruff==0.14.4"

      - name: Record versions
        run: |
          python -c 'import sys, numpy, pytest, yaml; print("python", sys.version.split()[0], "| numpy", numpy.__version__, "| pytest", pytest.__version__, "| pyyaml", yaml.__version__)'
          # ruff is pinned like the others, so it is recorded like the others --
          # otherwise the run that found something cannot say which version did.
          python -m ruff --version
          c++ --version | head -1   # the C++ probes are compiled by the suite

      - name: undefined-name family (ruff F821/F822/F823, whole harness)
        # F821 alone is not "Python name safety". F822 is an __all__ export
        # naming nothing; F823 is a local read before its own assignment, which
        # raises UnboundLocalError at runtime -- the same failure class the
        # NameError that started this belonged to, and one the hand-written
        # checker cannot see, because it collects every Store in a function
        # without ordering them against the Loads (owner review P1-C1).
        #
        # --isolated ignores any pyproject/ruff.toml that appears later and
        # could narrow the selection or exclude paths; --no-respect-gitignore
        # keeps an ignored-but-tracked file in scope. The step claims "whole
        # harness", so it should not be a configuration file away from meaning
        # something smaller (owner review P1-C2).
        run: >
          python -m ruff --isolated check
          --select F821,F822,F823
          --no-cache
          --no-respect-gitignore
          harness/

      - name: pytest (harness/tests — container, comparator, overlay, probes)
        run: python -m pytest -rs -q harness/tests

      - name: overlay 4-check (all instrumented TUs)
        run: python harness/g33_overlay/verify_overlay.py

      # NOTE: the G3.3-M Fortran leg (harness/g33_fortran/) is LOCAL-ONLY — the
      # reference host WRF/KIM-meso Fortran tree is gitignored (not distributed),
      # so it cannot run in CI. It is exercised by test_g33_fortran_build.py,
      # which SKIPS when gfortran or the reference source is absent (i.e. always
      # in CI) and builds+runs where the source is present (the owner's host).
