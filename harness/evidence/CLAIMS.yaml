  - id: G33-ICE-CAP-001
    text: >
      The ice-chain matched closure's missing term is the post-update-reservoir
      inflow cap (P0-4b): dq(i,k+1) is written twice, capped against the cell
      above PRE-update as its outflow and POST-update as the inflow below, and
      the difference is destroyed. Pairing departure against arrival explains
      100.00% of the ice mass residual. Departure differs from arrival at 39 of
      108 ice interfaces (total interface term 8.63e-03) and at 23 of 147 main
      interfaces (2.70e-11). "39 of 255, all in the ice chain" is CORRECTED: the
      ice count is right, but the main chain differs too and its term is simply
      eight orders smaller, which is why its residual stays at 1e-10--1e-12.
