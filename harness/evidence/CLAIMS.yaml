# Claim registry (owner §7.5).
#
# Findings accumulate corrections in place, so a reader cannot tell which
# sentence is current. `FINDING_refinement_noise_floor_v1` still says "only the
# rain-chain mstep is instrumented" in its limits while MSTEPI has been emitted
# since the two-chain work; the same document carries "clean order" beside the
# calibration that withdrew it. This file is the authority on status; the
# findings remain the narrative.
#
# status: active | superseded | withdrawn | hold
# evidence_kind: source | measurement | mixed
#   what the claim RESTS on. Classification by prose substring was itself
#   fail-open: `G33-NUMBER-008` ("three-arm falsification test") and
#   `G33-TRAJECTORY-001` ("an algebraic identity evaluated on six real runs")
#   are empirical and escaped a scan for the word "measurement" (owner P0-E4).
# run_support: [none] | [<fixture>, ...] | [unspecified]
#   the runs behind it, DECLARED. A keyword gate flagged G33-PROTOCOL-002
#   because its scope says it "does not re-verify physics already measured" --
#   a negative clause a scan cannot read (owner P0-3).
# artifact_status (active measurement claims only):
#   pinned                 -- an experiment manifest is pinned under `artifacts`
#   historical_unavailable -- the run happened but no bundle was published, so
#                             the chain stops at the finding
#   source_only            -- read from source, no run behind it
# Required so a missing run-artifact is DECLARED rather than invisible: the
# claim->commit machinery exists, but 14 of 16 active measurement claims still
# stop at a finding digest (owner P0-4).
# unbound: figures the TEXT publishes that this claim's artifacts cannot bind,
#   each with the reason. How completely a claim is bound is COMPUTED from
#   these and from what verifies -- `full`, `partial`, `none`, and UNDECLARED
#   for a pinned claim that says neither. It was a declared field for one cycle
#   and went wrong twice in it, both times `full` written beside a comment
#   admitting a gap, which a self-declaration cannot catch: the declaration is
#   the thing under test. The alternative -- scanning the prose for numeric
#   literals -- is refused, because deciding which numbers are figures
#   (`F:2922`, `31/144`, `12 fields x 3 columns`) is a judgement, and this is
#   where that judgement is recorded (owner §16-7).
# scope:  the fixture, precision and algorithm a claim is entitled to speak about
#
# Checked by harness/tests/test_g33_claims.py: every claim must name evidence
# that exists, every superseded_by must resolve, and no claim may be `active`
# while the finding it lives in has been withdrawn.

