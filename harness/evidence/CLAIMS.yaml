  - id: G33-BASIS-005
    text: >
      The PHYSICAL column measure is now one immutable LAYER MASS per (col, k),
      shared by every analyzer, instead of a density recomputed from each
      external call's own pre-sed qv. CORRECTED (owner P0-1): the first version
      took qv from the FIRST CALL's pre-sed record and called that the window
      start -- but other microphysics runs before it, so that is a sedimentation
      SEGMENT quantity and the distinction is the one S16-3 established for the
      number inventory. It also froze only the DENSITY while each call
      re-supplied its own delz, and keyed the measure on (loop, col, k), so a
      multi-tile run RAISED for every column outside the first tile. Now: rho
      and delz from the union of all calls, verified identical in each (they are
      forcing); qv from G33R INITIAL; mass = rho*dz frozen together; keyed
      (col, k). On this fixture the first pre-sed qv equals INITIAL qv in all 12
      cells and delz never moves, so no published figure changes -- the contract
      is what was wrong, not the numbers. Column microphysics transports no dry air,
      so rho_d for a layer is invariant across the window; recomputing it made
      the same layer's dry mass move by up to 0.0717% between calls, and a
      budget whose weights change with the process being measured is not a
      budget. The G33R ledger (_column_density) already held it at the initial
      qv and documented why -- the two halves of the codebase disagreed. Moving
      the G33N side to match shifts physical-basis residuals by at most 0.065%
      on rows above roundoff (ice/ni/3 -5.239382e+08 -> -5.233938e+08,
      ice/qi/3 -5.685992e-03 -> -5.680085e-03) and by 1.9% on main/qr/1, whose
      value is itself at f32 roundoff (-1.5068e-10 -> -1.5053e-10). The OPERATOR
      basis is byte-unchanged, because rho_m carries no qv: main/nr stays
      15.0036/13.3377/11.8402% and the ice cap share stays 100.00/100.00%.
    status: active
    evidence_kind: measurement
    run_support: [g33_fixture_multisubcycle_v1]
    artifact_status: pinned
    grade: confirmed
    basis: >
      measurement of both measures on the same stream, with the operator
      headlines shown unmoved
    scope: >
      g33_fixture_multisubcycle_v1, legacy, h = 25 s. The window-initial qv
      is read from `G33R INITIAL`, and rho and delz come from the union of all
      calls after being verified identical in each -- they are forcing. The
      measure is one immutable rho*dz per (col, k).
      .
      This scope previously described the FIRST implementation, which took qv
      from the first call's pre-sed record and refused a cell absent from that
      call. The text above corrects exactly that, so the two halves of this
      claim contradicted each other and a reader had to decide which was
      current (owner §6.2). The code matches the text: `window_cell_mass` reads
      ("initial", "qv", col, k) and keys the measure (col, k).
      .
      This does not settle whether the physical measure should be the canonical
      dry-air layer mass the host dynamics carries -- that is a separate
      binding, and G33-BASIS-002 remains the open compatibility question.
