  - id: G33-CHAIN-003
    text: >
      A claim reaches the commit that produced its numbers. The manifest pinned
      the analyzer's PATH and its content digest, and the checker compared that
      digest against the file in TODAY's working tree -- a comparison that can
      only answer "is it still the same", never "what did this bundle run", so
      an analyzer that legitimately moved on took the answer with it. That is
      why the check reported ANALYZER-CHANGED and never failed. Each analysis
      now pins `analyzer_commit` and `analyzer_blob_sha`, resolved by
      `git rev-parse <commit>:<path>`: a pin that does not resolve, or resolves
      to a different blob, FAILS. Verified by a test whose analyzer_sha256 is
      deliberately 0*64 and which passes anyway, because the working-tree digest
      is no longer what is asked. An analysis naming no analyzer used to fall
      through the guard and produce no row at all -- a bundle that pinned
      nothing looked like one that checked out -- and is now `analyzer-unpinned`
      in the report. All 45 CLAIMS.yaml pins (43 findings, 2 experiment
      manifests) are full 64-hex sha256; truncation survives only where it is
      display.
    status: active
    evidence_kind: mixed
    run_support: [unspecified]
    artifact_status: historical_unavailable
    blocker_kind: no-fixture
    migration_blocker: >
      run_support is [unspecified] -- no fixture named, so nothing can be
      tied to a run at all; that must be resolved before any bundle can be
      called its evidence
    grade: conditional-confirmed
    basis: >
      construction, with the resolvable-pin case proved by falsifying the
      working-tree digest it no longer depends on. CONDITIONAL because the
      registry-wide migration is not done: most active measurement claims still
      pin only a finding, not an experiment manifest, so the chain exists as
      machinery before it exists as coverage (owner P0-4).
    scope: >
      Bundles published BEFORE this pin existed carry only analyzer_sha256 and
      keep the report-only treatment, now NAMED `legacy-*` so a weak verdict
      cannot be read as a strong one; they cannot be retrofitted without
      re-publishing the artifacts the claims cite. The blob must be reachable in
      the checking clone -- a shallow clone reports UNRESOLVABLE, which fails by
      design, so the checker needs the history and not only the worktree. The
      pin is taken from HEAD at publish time and is only as good as the
      producer's dirty-tree refusal. The executable digest, the build script,
      the compiled overlay and a 7-file private reference source set ARE
      recorded in build_provenance -- verified on a fresh build -- but cannot be
      RE-DERIVED by the chain, because the driver binary is a build artifact and
      is not published in the bundle. Bundles published before these fields
      existed stop at the members, which the report shows rather than hides.
    evidence: [FINDING_claim_to_commit_chain_v1.md]
    evidence_sha256: [FINDING_claim_to_commit_chain_v1.md:24dff1c83961a4f89f11fa79bdd9d43fc1d2bc370955a0f557e6e2b596086174]
