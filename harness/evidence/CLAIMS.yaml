      The density matrix reproduces on the ICE chain, via the conservative
      variant whose cap fix makes ice/qi's mass control close in all six arms.
      ice/ni goes from +6.2789%/+7.0584% (as-is) to +0.0000% (uniform),
      -7.0312%/-7.9297% (inverted, ratio -0.9882/-1.0223), +11.9123%/+13.2653%
      (x2, ratio +2.0118/+1.9639), and barely moves under a +/-10% magnitude
      offset (+0.9878/+1.0292, +1.0123/+0.9405). The metric/trajectory
      decomposition is exact on ice too -- metric/base 0/-1/+2/+1 -- leaving a
      trajectory term of 0.59-5.95%, and no ice column changes its sub-step
      schedule so every row is comparable. This is a CROSS-CHAIN /
      CROSS-SPECIES / CROSS-VARIANT replication -- different sub-cycle (mstep_i),
      different species pair, different algorithm -- and NOT an independent one:
      fixture, intervention driver, parser, analyzer and layer-metric definition
      are shared, so a defect in any of them would reproduce here too (owner §9).
      The earlier "MAIN chain only" scope was a limitation of the LEGACY CAP, not
      of the mechanism.
