    evidence_sha256: [FINDING_bundle_analyses_v1.md:81210e5f2cc45183]

  - id: G33-COMPARE-001
    text: >
      The G33P comparison identity was a hand-written list that pinned five
      fields and left source_precision, loops, ntile, delt and the tile vector
      free -- so two runs differing in DECOMPOSITION could be compared as an
      algorithm variant, which ncmin makes a real hazard. The invariant set is
      now COMPUTED as IDENTITY minus the axis under test minus what covaries
      with it, so a field added to IDENTITY is an invariant by default. That
      removes the PER-COMPARISON omission, not the per-field one: IDENTITY is
      itself hand-written, so a header field never added to it stays invisible.
      Schema 3 carries
      the tile VECTOR because ntile cannot tell (2,1) from (1,2). The
      cross-precision ULP no longer depends on argument order -- the lattice is
      named in the field (max_ulp_f32) and `precision` is absent on a
      cross-precision diff -- and bitwise_identical is split into
      numerically_identical and raw_bit_identical, because +0.0 and -0.0 compare
      equal while their stored patterns differ.
    status: active
    grade: confirmed
    basis: >
      each hole reproduced as a pair the old comparator accepted; all previously
      published comparator figures reproduce unchanged
    scope: >
      The G33P stream contract and comparator. Fixture SHA and executable
      identity are still NOT in the stream -- they live in the bundle's
      build_provenance -- so identity is enforced at two levels and a comparison
      of loose streams outside a bundle cannot check them.
    evidence: [FINDING_comparison_identity_v1.md]
    evidence_sha256: [FINDING_comparison_identity_v1.md:1fffdf617f3574ac]

  - id: G33-BASIS-003
    text: >
      Every closure row now reports BOTH column measures: operator = rho_m*dz
      (what the kernel budgets) and physical = rho_d*dz (what is conserved), with
      rho_d = rho_m/(1+qv). Absolute values shift by the column-mean qv (~0.10%),
      and on THIS fixture the ratios agree to 1e-14 -- but only because 1+qv is
      nearly vertically constant (spread 2.6e-5 to 7.2e-4). Holding everything
      else fixed and varying only the humidity profile: uniform qv gives 2.2e-15,
      this fixture's column-3 spread gives 3.7e-4, and an ordinary troposphere
      (qv 2e-5 to 1.8e-2) gives 1.4e-2. "Ratios are unaffected by the basis" is
      therefore a property of a NEAR-DRY FIXTURE, not of the quantity. Separately
      measured: sedimentation leaves qv exactly unchanged (max |dqv| = 0), so
      using the pre-sed density at both endpoints is verified rather than assumed.
    status: active
    grade: confirmed
    basis: >
      measurement on the fixture plus a constructed humidity sweep holding all
      other inputs fixed
    scope: >
      g33_fixture_multisubcycle_v1, legacy, h = 25 s for the fixture numbers; the
      humidity sweep is CONSTRUCTED and shows the cancellation is contingent, not
      what the divergence is in any particular forecast. Number and mass rows
      only -- water and enthalpy are not yet on both bases. Says nothing about
      which basis the reference INTENDS, which is G33-BASIS-002 and an owner
      decision.
    evidence: [FINDING_dual_ledger_v1.md]
    evidence_sha256: [FINDING_dual_ledger_v1.md:d18c9e4d3502a6e7]

  - id: G33-MAGNITUDE-001
    text: >
      The headline R/F_surface of 11.84-15.00% is 0.2173/0.4379/0.6884% of the
      INITIAL column number and 0.2200/0.4507/0.7256% of the FINAL column number.
    status: withdrawn
    superseded_by: G33-MAGNITUDE-002
    scope: >
      The denominators were misnamed (owner P0-2). closures() accumulates x0 and
      x1 over calls, so `start`/`final` are sum_i N_i^pre and sum_i N_i^post --
      an inventory counted once per call -- not the window's initial and final
      column. "Of the final column" is the worse error: this fixture's column
      ends EMPTY, so that fraction is undefined and the figure published under
      that name was R / N_1^post.
    evidence: [FINDING_defect_magnitude_v1.md]
    evidence_sha256: [FINDING_defect_magnitude_v1.md:0d2027968658cbee]

  - id: G33-MAGNITUDE-002
    text: >
      Recomputed with each denominator named for what it divides by. On this
      fixture ONE of twelve calls carries any rain -- the remaining microphysics
      empties the column between call 1's post-sed and call 2's pre-sed -- so
      sum_i N_i^pre equals N(t_0) and R/N(t_0) is 0.2173/0.4379/0.6884%, the same
      number the withdrawn claim quoted but now correctly named and with the
      coincidence visible (active_calls 1/12). The window's FINAL inventory is
      0.000e+00, so "fraction of the final column" is UNDEFINED and 0.2200/
      0.4507/0.7256% is withdrawn outright. The size figures are relabelled
      FROZEN-TRAJECTORY and segment-local: they hold q at what this run produced
      and exclude the feedback of corrected number on later sub-steps, so they
      bound nothing about a forecast. N(t_0) is now the WINDOW initial inventory,
      read from this stream's own G33R INITIAL records, rather than the first
      sedimentation call's pre-sed column wearing that name; the two are measured
      to agree here (3.88440e+07 / 9.26900e+06 / 1.99322e+06, exactly) and the
      analysis reports that agreement per row instead of assuming it.
    status: active
    grade: confirmed-with-scope
    basis: >
      measurement with per-call inventory preserved, so the aggregation is
      visible rather than hidden in a sum
    scope: >
      g33_fixture_multisubcycle_v1, legacy, h = 25 s, main chain. R/N(t_0)
      coincides with the inventory-weighted per-call mean ONLY because one call
      is active; on a fixture where several calls carry inventory the two differ
      and must not be conflated. The frozen-trajectory size bounds require a
      corrected-number counterfactual run to become forecast statements, which
      needs a production physics change and is not done. The segment/window
      endpoint agreement is MEASURED ON THIS FIXTURE, not a kernel property: a
      fixture with pre-sedimentation number sources would separate them. R is an
      integrated spurious SOURCE; the retained final bias N_legacy(t_f) -
      N_corrected(t_f) is a different quantity, identically zero here only
      because this window ends empty, and unmeasured in general.
    evidence: [FINDING_defect_magnitude_v1.md]
    evidence_sha256: [FINDING_defect_magnitude_v1.md:0d2027968658cbee]

  - id: G33-BASIS-004
    text: >
      The water and enthalpy column ledgers now take a basis, completing §9.2.
      The basis matters ONLY where the residual is otherwise at roundoff: column
      1 water closes at 4.5703e-09 relative under the operator measure and
      9.7626e-07 under the physical one, 213.6x worse, while columns 2 and 3
      (already 6.8e-2 and 1.7e-1, dominated by the precipitation-diagnostic
      departure) change by 1.0x. The enthalpy result "at most 3%" is CORRECTED
      (owner P0-3): it was an artifact of a MIXED measure -- _ledger weighted its
      endpoints by rho_d while _water_out was fixed at rho_m, so the "physical"
      residual differenced a dry column change against a moist outflow. With the
      basis threaded through the outflow too, the relative enthalpy residual is
      basis-invariant to 3e-11 or better in all six rows, while the absolute
      terms still shift by the column-mean qv. The previously reported 2.6-2.8%
      was the dry/moist mismatch, not a basis sensitivity. rho_d is taken from the INITIAL qv and
      used at both endpoints, because rho_d*dz is invariant across a
      column-microphysics step and a budget whose weights move with the process
      is not a budget.
    status: active
    grade: confirmed
    basis: measurement on both bases over the same member
    scope: >
      n12.rezero of the legacy refinement chain on g33_fixture_multisubcycle_v1.
      Says nothing about which basis the reference INTENDS to close, which is
      G33-BASIS-002 and an owner decision. P_surface is the WRF rain diagnostic
      and is not reweighted -- it is already a physical mass per area -- so the
      physical budget mixes a dry-weighted column change with a diagnostic whose
      own departure from the rho*dz budget is a separate known defect, and that
      defect dominates columns 2-3.
    evidence: [FINDING_water_enthalpy_dual_basis_v1.md]
    evidence_sha256: [FINDING_water_enthalpy_dual_basis_v1.md:c41ceb2d8a557127]

  - id: G33-PROTOCOL-003
    text: >
      Four defects a green suite did not see. (1) The Fortran G33P literal stayed
      at 3 while the parser moved to 4, so every probe and f64 bundle was
      unproducible; the parser's own tests build synthetic streams at its own
      version and no test fed real driver output to pr.read(). Fixed, plus a
      static driver-vs-parser version check that runs in public CI and an
      end-to-end local test that builds both arms. (2) The magnitude denominators
      were misnamed -- see G33-MAGNITUDE-002. (3) The "physical" enthalpy ledger
      differenced a dry column change against a moist outflow because _water_out
      was fixed at rho_m; the mixture MANUFACTURED the reported 2.6-2.8% basis
      sensitivity, and with the basis threaded through the outflow the relative
      residual is basis-invariant to 1e-11. (4) g33_evidence_chain --check failed
      on MISMATCH but not on absent, so a bundle whose raw streams and analyses
      had all been deleted still certified; child absence under a present,
      matching manifest is now a failure while an absent manifest stays
      unavailable.
    status: active
    grade: confirmed
    basis: each defect reproduced, fixed, and pinned by a test at the level that missed it
    scope: >
      The G33P/G33N protocol contract, the matched-closure denominators, the
      enthalpy ledger basis, and the evidence-chain check. The plain G33R stream
      still does not carry the density arm and is NOT changed here: doing so
      would invalidate 72 archived member files, the pinned non-invasiveness
      baseline and the four-case comparator's decision inputs, which is an owner
      decision. The gap is closed by construction instead -- the producer refuses
      a non-default rho-profile on a path that would not record it.
    evidence: [FINDING_schema_drift_and_denominators_v1.md]
    evidence_sha256: [FINDING_schema_drift_and_denominators_v1.md:a1622c2e598ccad8]

  - id: G33-TRAJECTORY-001
    text: >
      The density arms' departure from exactly -1 and +2 is decomposed rather
      than attributed: R(rho') = sum drho'*dz*d(rho) [metric] + sum
      drho'*dz*[d(rho')-d(rho)] [trajectory], an identity. The metric term is
      EXACTLY 0/-1/+2 by construction, so the entire departure is the trajectory
      response, measured at 1.04%/0.81% (inverted) and 0.58%/0.45%/2.04% (x2) of
      the metric term. The OFFSET arms separate gradient from magnitude
      directly: adding a constant to every level cancels out of
      (rho_below - rho_above), so a +/-10% absolute density shift leaves the
      metric term at exactly 1.0 (11 of 12 metric ratios bit-exact, the twelfth
      5.8e-7 from f32 roundoff on the offset addition) while a doubled gradient
      puts it at exactly 2.0. The residual follows the GRADIENT; the 2.25-6.68%
      it moves under an offset is trajectory by construction. Stated precisely
      (owner §8): the DIRECT metric source term depends on the gradient only --
      a uniform offset leaves it at exactly 1.0 -- while the TOTAL residual is
      gradient-dominant but measurably magnitude-sensitive THROUGH the
      trajectory, by up to 6.68% here. The stronger form -- that absolute
      density is irrelevant -- is NOT claimed; see the finding, which quotes and
      withdraws it. Interfaces are paired by EXACT KEY
      (call, loop, sub-step, upper, lower), not by count, so a same-count
      different-universe pair is refused rather than mis-paired (owner P0-1).
      The earlier attribution to fall speed alone stays
      withdrawn -- this measures the term's SIZE, not its composition.
      Separately, the control "mstep identical in all four arms" is CORRECTED:
      the test merged calls under keys identical across calls, so it compared
      only the last call. Per call, inverted drops column 3's mstep from 3 to 2
      in call 1, so that column has no interface correspondence and is reported
      not-comparable rather than zipped.
    status: active
    grade: confirmed
    basis: >
      an algebraic identity evaluated on six real runs, over an interface
      universe matched by EXACT KEY rather than by count, with the metric term
      verified exact against the profiles' construction. The owner's
      CONDITIONAL grade pending exact interface identity is satisfied by that
      keying; a same-count different-universe pair is now refused.
    scope: >
      g33_fixture_multisubcycle_v1, legacy, main chain, h = 25 s. The trajectory
      term is not further decomposed -- it is everything the perturbation did to
      the run, and its size is measured, not apportioned. The metric
      counterfactual is defined only where the sub-step schedule holds.
    evidence: [FINDING_metric_trajectory_split_v1.md]
    evidence_sha256: [FINDING_metric_trajectory_split_v1.md:add9b27668bf353d]

  - id: G33-NUMBER-009
    text: >
      The density matrix reproduces on the ICE chain, via the conservative
      variant whose cap fix makes ice/qi's mass control close in all six arms.
      ice/ni goes from +6.2789%/+7.0584% (as-is) to +0.0000% (uniform),
      -7.0312%/-7.9297% (inverted, ratio -0.9882/-1.0223), +11.9123%/+13.2653%
      (x2, ratio +2.0118/+1.9639), and barely moves under a +/-10% magnitude
      offset (+0.9878/+1.0292, +1.0123/+0.9405). The metric/trajectory
      decomposition is exact on ice too -- metric/base 0/-1/+2/+1 -- leaving a
      trajectory term of 0.59-5.95%, and no ice column changes its sub-step
      schedule so every row is comparable. This is a CROSS-CHAIN /
      CROSS-SPECIES / CROSS-VARIANT replication -- different sub-cycle (mstep_i),
      different species pair, different algorithm -- and NOT an independent one:
      fixture, intervention driver, parser, analyzer and layer-metric definition
      are shared, so a defect in any of them would reproduce here too (owner §9).
      The earlier "MAIN chain only" scope was a limitation of the LEGACY CAP, not
      of the mechanism.
    status: active
    grade: confirmed
    basis: >
      the same six arms with the ice mass control closing throughout, the exact
      metric counterfactual, AND the number-cap term computed per arm rather than
      assumed. R_full splits exactly as R_measure + R_ncap; R_ncap is exactly
      zero at every conservative-ice interface in every arm, so the metric
      reading is complete there. The gate is not vacuous: on LEGACY ice the cap
      binds at 39/108 interfaces and R_ncap DOMINATES R_measure (e.g. -5.33e+08
      against 0 for uniform col 3), and measure_only reports false on all ten
      legacy rows. The owner's CONDITIONAL grade, pending exactly this term, is
      satisfied by measurement.
    scope: >
      g33_fixture_multisubcycle_v1, CONSERVATIVE variant, h = 25 s, ice columns 2
      and 3 (column 1 carries no usable inventory). The conservative variant is
      what makes the measurement possible and is NOT the reference; legacy's ice
      chain remains unmeasurable for the post-update cap reason. Constructed
      probes, and the trajectory term is measured but not apportioned.
    evidence: [FINDING_ice_density_matrix_v1.md]
    evidence_sha256: [FINDING_ice_density_matrix_v1.md:3d94fd004e3bff54]

  - id: G33-PROTOCOL-004
    text: >
      An f64 bundle supplies its own member_reader, and the manifest builder left
      `runs` empty on that path, so BOTH cross-member checks were skipped: the
      duplicate-nsplit guard and require_same_universe. Every member was
      strict-parsed alone; nothing checked them against each other, so a
      published f64 refinement chain could mix fixtures, algorithms, modes, tile
      maps, density arms, horizons, a duplicate nsplit, or different record
      universes. require_probe_chain applies the pairwise `refinement` contract
      across the bundle and adds two the pairwise form does not need -- one
      integration horizon (nsplit*delt, since neither factor alone pins it) and
      that the chain actually refines (>1 distinct dtcld). The duplicate check no
      longer depends on the reader. Verified by producing a real three-member
      f64 chain, which also confirms P0-1 is closed in the producer and not only
      in the driver.
    status: active
    grade: confirmed
    basis: >
      each admitted mixture reproduced as a chain the old path accepted, plus a
      real f64 bundle produced end to end
    scope: >
      Cross-member within one bundle. Two separately published f64 bundles can
      still disagree -- that identity lives in a claim's artifacts pins.
      CHAIN_INVARIANT is COMPUTED as IDENTITY minus {dtcld, nsplit, delt}, so a
      field already in IDENTITY is a chain invariant by default. It does NOT
      make the contract fail-closed against a new header field: IDENTITY is
      hand-written, so a field added to the G33P header and not to IDENTITY is
      invisible to this check and to the pairwise one alike. What the change
      removes is the per-chain omission, not the per-field one. It was first
      enumerated, on the argument that a chain has no axis to subtract; that
      argument was wrong -- dtcld IS the axis and nsplit/delt covary with it,
      exactly as the pairwise contract declares.
    evidence: [FINDING_probe_chain_contract_v1.md]
    evidence_sha256: [FINDING_probe_chain_contract_v1.md:39ce4e6e5dbcc011]

