      - kdm6ad-g33m-migrate/ncmin-001.bundles/9300dd617379610d71a67717020da9abb38a10a42b5ff1719e278c3564cf0072/g33_fixture_boundary_mapping_v1.ncmin_locality.json#local_oracle.partitions.2,1.column_integrated.operator.1/qr.signed_rel: 0.20668056982756972
      - kdm6ad-g33m-migrate/ncmin-001.bundles/9300dd617379610d71a67717020da9abb38a10a42b5ff1719e278c3564cf0072/g33_fixture_boundary_mapping_v1.ncmin_locality.json#partitions.2,1.components_differing: 31
