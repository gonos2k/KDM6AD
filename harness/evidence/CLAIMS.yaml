  - id: G33-NCMIN-001
    text: >
      ncmin is a scalar overwritten in the column loop, so tile decomposition
      changes up to 31/144 prognostic state COMPONENTS -- 12 fields x 3 columns
      x 4 levels -- across 2 of the 12 physical grid cells. (The claim text said
      "cells", which the finding had already corrected but the authority had
      not; owner §12.1.) The SIZE is now measured, not
      asserted: cloud ice differs by 9.9661e-01 relative (68.5M ulps, 8.4e+06 x
      f32 eps) and ni by 8.8394e-01, with all twelve prognostics moving and the
      smallest of them still 142x f32 eps. CORRECTED (owner §11.3): those are
      RATIOS, and a ratio near 1 says the runs disagree about a value, not that
      the value is large -- qi's 0.9966 sits on a 6.56e-08 kg/kg baseline, an
      absolute difference of 1.93e-05. Integrated over the column under the
      rho*dz measure, which is the only physical form, the result is COLUMN RAIN
      MASS differing by 20.67% (col 1) and 26.13% (col 2), cloud ice by 8.78%
      (col 1), and TOTAL CONDENSATE by 3.25% and 2.68%. The earlier "cloud ice
      is decided to O(1)" headline is withdrawn as a physical statement. Both
      bases are now computed (owner §7.1): the RELATIVE figures are identical
      under operator rho_m*dz and physical rho_d*dz -- necessarily, since both
      runs share the window-initial qv and the 1+qv weight cancels in the ratio
      -- while the absolute masses differ by 0.10-0.17%. So the headline does
      not depend on the basis, but it is measured under both rather than
      asserted under one. The affected-column PREDICTION now includes the
      threshold-activation predicate (owner §7.2): ncmin is both a gate and a
      floor (max(ncmin,nci), F:2736/2750/2888), and the two candidates agree
      where the number exceeds BOTH. Here nc runs 4.00e+07..5.04e+07 against
      2.5e+07 and 1.0e+08, so the gate is active in every cell -- which is WHY
      the prediction is exact on this fixture rather than a general property.
      DIRECT-SUM ORACLE (owner §12-5), computed with the UNMODIFIED kernel: a
      one-column tile leaves ncmin holding that column's own threshold, so
      (1,1,1) IS M_local(X) = (+)_i M_i(X_i; xland_i). Measured against it, the
      WHOLE-DOMAIN single-tile run differs in 16/144 components, all in the sea
      column, at -20.72% column rain; (1,2) the same; (2,1) differs in column 1
      at +20.67% because its first tile ends on sea. SIGN CORRECTED (owner
      §9.4): this said "+20.72%" and "too much". The whole-domain run gates the
      sea column on ncmin_land (1.0e+08) rather than its own ncmin_sea
      (2.5e+07), and it rains ~21% LESS than the per-column answer. The PROCESS
      carrying that sign is NOT measured (owner §7): ncmin gates 18 sites in the
      reference -- autoconversion (praut), three accretion branches, graupel
      melting/evaporation (pgeml), and the max(ncmin,nci) floors that set the
      diameters those rates consume -- and a final-state comparison cannot say
      which of them carries it. Suppressed autoconversion is the leading
      candidate and is no longer stated as the mechanism; an earlier version of
      this text asserted it. The direction is now a
      signed field in the artifact and asserted. Both bases agree, but NOT by an
      identity (owner §9.2): a_k = 1/(1+qv(t0)) sits inside the column sum, so
      only a vertically CONSTANT weight cancels -- on this fixture its spread is
      exactly zero, which is measured rather than assumed. "Production" is
      withdrawn as a description (owner §9.3): this is a three-column synthetic
      fixture called as one tile by a sequential driver, with no MPI ranks,
      haloes, real coastal layout or multi-step feedback. Attribution to ncmin
      alone rests on (1,2) differing from the whole domain in ZERO components
      despite a changed decomposition -- nothing else here responds to tiling. Both variants differ in
      exactly the same 0/16/31 cells and columns, so the conservative interface
      does NOT fix it. Unresolved; needs an owner decision among per-column
      ncmin, accepting the partition dependence, or splitting the variants --
      and "accept" now means accepting an O(1) dependence on the decomposition,
      not a last-bit wobble.
    status: active
    evidence_kind: measurement
    run_support: [g33_fixture_boundary_mapping_v1]
    artifact_status: historical_unavailable
    migration_blocker: needs a MULTI-RUN analysis: the producer's contract is (stream, basis) per member, and g33_ncmin_locality is (driver, fixture) and runs the driver once per decomposition
    grade: confirmed
    basis: >
      exhaustive measurement over the contiguous partitions, with the
      roundoff verdict shown able to come out either way
    scope: >
      g33_fixture_boundary_mapping_v1, one call, legacy and conservative. The
      real mixed-coastal case is still UNMEASURED, so the operational magnitude
      is not established -- only that the mechanism is O(1) where it bites. The
      (1,2) partition differs in ZERO cells because both tiles end on land: an
      even-split-only gate would pass while the operator was arbitrarily
      non-local, which is why the partition set is exhaustive. "31/144" counts
      prognostic state COMPONENTS (12 fields x 3 columns x 4 levels); the grid
      has 12 cells, so calling them cells overstated the spatial extent twelvefold
      (owner §11.1). The derived quantities that would decide operational
      significance -- q/N, characteristic diameter, reflectivity, surface
      precipitation -- are NOT measured, and neither is a real MPI rank
      decomposition with haloes and per-rank surface patterns: this is a
      sequential multi-call tile experiment that PREDICTS rank sensitivity
      rather than demonstrating it.
    evidence: [FINDING_ncmin_scalar_vs_percell.md]
    evidence_sha256: [FINDING_ncmin_scalar_vs_percell.md:4c53b950254ee4b277ced73961b2d37f58b112c399f180c979370991b10010d9]

  - id: G33-ENTHALPY-003
    text: >
      The moist-enthalpy ledger charged the column's WHOLE rho*dz water loss as
      precipitation, at the bottom-level temperature and the fallout
      diagnostic's frozen fraction. On this fixture 57.81% (col 2) and 48.02%
      (col 3) of that loss was destroyed at INTERNAL interfaces by the
      post-update-reservoir cap and never reached the surface. Measured directly
      from the CAPIN/TOPOUT interface pairing -- 2.9422e-03 and 5.6860e-03 kg/m2
      against a column loss of 5.0895e-03 and 1.1842e-02 -- and charged at the
      level it died at, in the phase of the kernel array whose cap destroyed it
      (main <- dqr, rain, liquid, F:1225; ice <- dqi, cloud ice, F:1289). The
      correction is 20.74% of column 2's enthalpy residual and -4.05% of column
      3's. It does NOT close the residual and makes column 2's WORSE; it is a
      correctness fix to the charge, not an explanation of the residual.
      CORRECTED (owner P0-1): the first version charged at the WINDOW-INITIAL
      temperature, but the sink happens inside a particular external call and
      this stream has twelve. Column 3's levels are 1.77 K from their start by
      call 12, worth ~21 J/m2 -- the size of the correction itself -- so the
      column-3 figure moved from -28.008 to -21.848 J/m2, a 22% change. The
      charge now uses THIS CALL's pre-sedimentation temperature, which every
      outer_pre_sed record already carried. Departure- and arrival-level charges
      are both reported: the band is 3.098 and 5.685 J/m2 (21% and 26% of the
      term), because a numerical annihilation has no single true location.
      SIGNED vs GROSS (owner P1-1): `-mass_term` goes negative where an
      interface creates, so column 1's reported sink of -1.7428e-11 was
      impossible for a sink. It is 1.69e-11 destroyed against 3.43e-11 created,
      cancelling at roundoff. Energy accounting takes the signed sum; the
      "cap destroyed X" sentence takes gross destroyed. Columns 2 and 3 are
      effectively single-signed, so the headline share is unchanged.
      The inferred alternative is unusable: outflow_split's D_internal = w -
      P_bottom is NEGATIVE in all three columns, which a cap cannot be, and
      disagrees with the measurement in sign and by 4-6x in magnitude.
    status: active
    evidence_kind: measurement
    run_support: [g33_fixture_multisubcycle_v1]
    artifact_status: pinned
    grade: confirmed-with-scope
    basis: >
      direct interface measurement, with the diagnostic-inferred alternative
      shown to be sign-impossible rather than merely noisier
    scope: >
      g33_fixture_multisubcycle_v1, legacy, h = 25 s, operator basis. The sink is
      a LOWER BOUND: the kernel caps dqr/dqs/dqg/dqi and only dqr and dqi carry a
      CAPIN anchor, while snow and graupel ARE present on this fixture at column
      losses of the same order as the measured sink -- so the shortfall is real
      and no upper bound is established. Instrumenting dqs/dqg is an overlay
      extension that widens the emitted main|ice chain vocabulary and is
      deferred as a protocol change. enthalpy_ledger() without a sink is
      unchanged, so the previous figures remain reproducible. The enthalpy
      correction is CONDITIONAL on the departure-level convention: the
      attribution band is reported beside it and physical enthalpy closure
      remains HOLD.
    # Re-run under the CURRENT producer and pinned. Every published
