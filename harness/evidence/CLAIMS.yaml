      300 s is a different statement. Diameter assumes D ~ (q/N)^(1/3) and is not
      a reflectivity calculation.
    evidence: [FINDING_defect_magnitude_v1.md]
    evidence_sha256: [FINDING_defect_magnitude_v1.md:d9a6cc91327e7c9c]

