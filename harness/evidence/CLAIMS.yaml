  - id: G33-PROTOCOL-003
    text: >
      Four defects a green suite did not see. (1) The Fortran G33P literal stayed
      at 3 while the parser moved to 4, so every probe and f64 bundle was
      unproducible; the parser's own tests build synthetic streams at its own
      version and no test fed real driver output to pr.read(). Fixed, plus a
      static driver-vs-parser version check that runs in public CI and an
      end-to-end local test that builds both arms. (2) The magnitude denominators
      were misnamed -- see G33-MAGNITUDE-002. (3) The "physical" enthalpy ledger
      differenced a dry column change against a moist outflow because _water_out
      was fixed at rho_m; the mixture MANUFACTURED the reported 2.6-2.8% basis
      sensitivity, and with the basis threaded through the outflow the relative
      residual is basis-invariant to 1e-11. (4) g33_evidence_chain --check failed
      on MISMATCH but not on absent, so a bundle whose raw streams and analyses
      had all been deleted still certified; child absence under a present,
      matching manifest is now a failure while an absent manifest stays
      unavailable.
    status: active
    evidence_kind: source
    run_support: [none]
    artifact_status: not_applicable
    grade: confirmed
    basis: each defect reproduced, fixed, and pinned by a test at the level that missed it
    scope: >
      The G33P/G33N protocol contract, the matched-closure denominators, the
      enthalpy ledger basis, and the evidence-chain check. The plain G33R stream
      still does not carry the density arm and is NOT changed here: doing so
      would invalidate 72 archived member files, the pinned non-invasiveness
      baseline and the four-case comparator's decision inputs, which is an owner
      decision. The gap is closed by construction instead -- the producer refuses
      a non-default rho-profile on a path that would not record it.
    evidence: [FINDING_schema_drift_and_denominators_v1.md]
    evidence_sha256: [FINDING_schema_drift_and_denominators_v1.md:a1622c2e598ccad88bfbaa59fb9ed5b5cfbafe7281ba3cde1f2d22122ec76313]

  - id: G33-TRAJECTORY-001
    text: >
      The density arms' departure from exactly -1 and +2 is decomposed rather
      than attributed: R(rho') = sum drho'*dz*d(rho) [metric] + sum
      drho'*dz*[d(rho')-d(rho)] [trajectory], an identity. The metric term is
      EXACTLY 0/-1/+2 by construction, so the entire departure is the trajectory
      response, measured at 1.04%/0.81% (inverted) and 0.58%/0.45%/2.04% (x2) of
      the metric term. The OFFSET arms separate gradient from magnitude
      directly: adding a constant to every level cancels out of
      (rho_below - rho_above), so a +/-10% absolute density shift leaves the
      metric term at exactly 1.0. CORRECTED against the pinned artifact: this
      said "11 of 12 metric ratios bit-exact, the twelfth 5.8e-7". The run
      carries THIRTEEN metric ratios -- inverted 2, offset+ 2, offset- 3,
      uniform 3, x2 3, the short arms being the not-comparable columns named
      below -- of which TWELVE are bit-exact and the THIRTEENTH, offset+
      column 2, is 1.0000005804669767: 5.8e-7 from f32 roundoff on the offset
      addition. A doubled gradient
      puts it at exactly 2.0. The residual follows the GRADIENT; the 2.20-6.68%
      it moves under an offset is trajectory by construction (CORRECTED from
      2.25%: the smallest offset-arm trajectory ratio is offset+ column 2 at
      2.20%, not offset+ column 1 at 2.25%). Stated precisely
      (owner §8): the DIRECT metric source term depends on the gradient only --
      a uniform offset leaves it at exactly 1.0 -- while the TOTAL residual is
      gradient-dominant but measurably magnitude-sensitive THROUGH the
      trajectory, by up to 6.68% here. The stronger form -- that absolute
      density is irrelevant -- is NOT claimed; see the finding, which quotes and
      withdraws it. Interfaces are paired by EXACT KEY
      (call, loop, sub-step, upper, lower), not by count, so a same-count
      different-universe pair is refused rather than mis-paired (owner P0-1).
      The earlier attribution to fall speed alone stays
      withdrawn -- this measures the term's SIZE, not its composition.
      Separately, the control "mstep identical in all four arms" is CORRECTED:
      the test merged calls under keys identical across calls, so it compared
      only the last call. Per call, inverted drops column 3's mstep from 3 to 2
      in call 1, so that column has no interface correspondence and is reported
      not-comparable rather than zipped.
    status: active
    evidence_kind: mixed
    run_support: [g33_fixture_multisubcycle_v1]
    artifact_status: pinned
    grade: confirmed
    basis: >
      an algebraic identity evaluated on six real runs, over an interface
      universe matched by EXACT KEY rather than by count, with the metric term
      verified exact against the profiles' construction. The owner's
      CONDITIONAL grade pending exact interface identity is satisfied by that
      keying; a same-count different-universe pair is now refused.
    scope: >
      g33_fixture_multisubcycle_v1, legacy, main chain, h = 25 s. The trajectory
      term is not further decomposed -- it is everything the perturbation did to
      the run, and its size is measured, not apportioned. The metric
      counterfactual is defined only where the sub-step schedule holds.
