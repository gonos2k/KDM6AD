      ice chain runs the whole external call in ONE sub-step at h = 25 s, on
      every call, where the main chain needs h = 6.25 s to do the same.
      .
      PRECISION (owner §8): the intermediate counts are MAXIMA over calls, not
      schedules. At h = 25 s column 3's main chain ran 1, 2 and 3 sub-steps on
      different calls, so "needs 3" describes its worst call. The claim's own
      statement is unaffected, because it is about REACHING one: where the
      maximum is 1 the column ran 1 on every call, which is measured
