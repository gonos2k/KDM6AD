  - id: G33-COMPARE-001
    text: >
      The G33P comparison identity was a hand-written list that pinned five
      fields and left source_precision, loops, ntile, delt and the tile vector
      free -- so two runs differing in DECOMPOSITION could be compared as an
      algorithm variant, which ncmin makes a real hazard. The invariant set is
      now COMPUTED as IDENTITY minus the axis under test minus what covaries
      with it, so a field added to IDENTITY is an invariant by default. That
      removes the PER-COMPARISON omission, not the per-field one: IDENTITY is
      itself hand-written, so a header field never added to it stays invisible.
      Schema 3 carries
      the tile VECTOR because ntile cannot tell (2,1) from (1,2). The
      cross-precision ULP no longer depends on argument order -- the lattice is
      named in the field (max_ulp_f32) and `precision` is absent on a
      cross-precision diff -- and bitwise_identical is split into
      numerically_identical and raw_bit_identical, because +0.0 and -0.0 compare
      equal while their stored patterns differ.
    status: active
    evidence_kind: source
    run_support: [none]
    artifact_status: not_applicable
    grade: confirmed
    basis: >
      each hole reproduced as a pair the old comparator accepted; all previously
      published comparator figures reproduce unchanged
    scope: >
      The G33P stream contract and comparator. Fixture SHA and executable
      identity are still NOT in the stream -- they live in the bundle's
