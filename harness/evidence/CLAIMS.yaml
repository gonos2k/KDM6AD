  - id: G33-BASIS-001
    text: >
      `den` passed to the kernel is MOIST-air density (rho = 1/alt*(1+qv),
      module_big_step_utilities_em.F:4856, alt = inverse dry density) while `nr`
      is # per kg of DRY air (Registry.EM_COMMON:122). The rho*dz weight
      therefore overstates by (1+qv): 0.10% on this fixture, ~2% in a moist
      operational layer. It does NOT explain the 6-14% number residual, but it is
      a systematic offset on the absolute # m-2 figures.
    status: active
    evidence_kind: mixed
    run_support: [g33_fixture_multisubcycle_v1]
    artifact_status: historical_unavailable
    blocker_kind: needs-derived-field
    migration_blocker: >
      principally a SOURCE claim -- module_big_step_utilities_em.F:4856 and
      Registry.EM_COMMON:122 -- carrying one measured figure, the 0.10%
      column-mean qv. That figure CHECKS OUT: the window-initial qv is
      exactly 1.000e-3 in column 1 (and 1.020e-3, 1.040e-3 in columns 2 and
      3), vertically constant, which is also why the physical basis is a
      per-column constant here and the ratios agree to roundoff.

      It still cannot bind. `G33R INITIAL` carries qv in the STREAM, but no
      pinned JSON holds it: dual_ledger stores 1+qv as
      `humidity.N.min`/`max` (1.0010000000474975 in column 1), so binding
      0.10% would take a subtraction the artifact does not perform. Needs a
      derived qv field, which is a one-line addition to the humidity block --
      and re-producing the archive, since every instrumented bundle would
      then be missing it
    grade: confirmed
    basis: source + measurement
    scope: g33_fixture_multisubcycle_v1 for the magnitude; source for the bases
    evidence: [FINDING_number_mass_basis_v1.md]
    evidence_sha256: [FINDING_number_mass_basis_v1.md:e2e884082d875ff9e56c8444187f0a561bc2ab4af10e5c6d32a5ccc0498023cb]

  - id: G33-BASIS-002
    text: >
      Which measure a CORRECTED number transport should conserve, as a matter
      of compatibility and default policy -- NOT which measure is physical.
      .
      SPLIT (owner review §11): the previous wording asked "whether the
      reference intends rho_d*dz*nr or rho_m*dz*nr as the conserved measure",
      which put a unit fact and two policy decisions in one open question, so
      a scientific fact read as if it were awaiting a preference. The pieces
      are:
      .
      (1) The PHYSICAL column number is sum(rho_d*dz*nr) -- forced by units,
      not chosen: `nr` is per kg of DRY air (WRF registry, QVAPOR basis), so
      multiplying by moist density counts water vapor as carrier mass. This is
      G33-BASIS-006 and is a source claim, not a decision.
      .
      (2) The measure the LEGACY OPERATOR actually budgets is rho_m*dz on the
      mass side and effectively dz-only on the number side -- measured, and it
      is the defect G33-NUMBER-003 confirms. Also not a decision.
      .
      What REMAINS a decision, and what this claim now holds open: whether the
      corrected transport preserves bit-compatibility with the legacy
      operator's pseudo-measure where it is not conserving anything (an
      engineering policy), and whether the default variant promotes to the
      physical measure (a release decision).
    status: hold
    grade: open-question
    basis: none
    scope: >
      owner engineering-compatibility and release policy; the physics is
      G33-BASIS-006 and the operator's measured behaviour is G33-NUMBER-003
    evidence: [FINDING_number_mass_basis_v1.md]
    evidence_sha256: [FINDING_number_mass_basis_v1.md:e2e884082d875ff9e56c8444187f0a561bc2ab4af10e5c6d32a5ccc0498023cb]

  - id: G33-BASIS-006
    text: >
      The physical column number measure is sum_k rho_d,k * dz_k * nr_k,
      because `nr` is a mixing ratio per kg of DRY air: the WRF registry
      declares the QVAPOR basis dry (kg kg-1 dry), `nrs(i,k,1) = nr(i,k,j)`
      packs it unchanged (F:388), and a per-dry-kg quantity times moist
      density counts water vapor as carrier mass. Unit-forced, not chosen.
      rho_m*dz*nr remains meaningful only as the legacy operator's
      pseudo-measure, which is a statement about the operator (G33-NUMBER-003),
      not about particles.
    status: active
    evidence_kind: source
    run_support: [none]
    artifact_status: not_applicable
    grade: confirmed
    basis: >
      unit analysis of pinned source definitions (F:388, WRF registry
      QVAPOR basis)
    scope: >
      source definitions only; which measure the correction adopts as
      default is G33-BASIS-002, which stays an owner decision
    evidence: [FINDING_number_mass_basis_v1.md]
    evidence_sha256: [FINDING_number_mass_basis_v1.md:e2e884082d875ff9e56c8444187f0a561bc2ab4af10e5c6d32a5ccc0498023cb]

