  - id: G33-PROTOCOL-002
    text: >
      The G33N extension protocol was not fail-closed in six ways: a declared
      feature with zero records passed, a same-value duplicate overwrote silently,
      an undeclared record was parsed anyway, an extension record outside a call
      was dropped, NaN/Inf in XFER/TOPOUT was accepted, and TOPOUT was checked on
      its sub-step only so a wrong-level record passed. The stage level universe
      was also pooled across columns, so a column short a level passed whenever
      another supplied it -- which the matched closure would have integrated over
      fewer cells with the wrong bottom cell. Schema 3 requires the exact
      (sub-step, level) universe per (call, loop, column, chain), an exact
      rectangular stage universe, and binding feature declaration in both
      directions.
    status: active
    grade: confirmed
    basis: >
      each hole reproduced as a constructed malformed stream that the old parser
      accepted and the new one refuses; the real stream is accepted unchanged and
      reproduces the same closure numbers
    scope: >
      The G33N stream contract. It makes the protocol fail-closed; it does not
      re-verify physics already measured under schema 2, and the cap-attribution
      run has not been re-published under the new contract.
    evidence: [FINDING_schema3_fail_closed_v1.md]
    evidence_sha256: [FINDING_schema3_fail_closed_v1.md:4568713326597f07]

