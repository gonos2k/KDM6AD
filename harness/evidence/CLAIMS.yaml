    grade: confirmed
    basis: source
    scope: module_mp_kdm6.F:1179-1180, all fixtures
    evidence: [FINDING_two_sedimentation_chains_v1.md]
    evidence_sha256: [FINDING_two_sedimentation_chains_v1.md:c0aec6b997c15a9f]

  - id: G33-DTCLD-002
