  - id: G33-NUMBER-008
    text: >
      The Delta-z-only number-transfer metric, applied across a nonzero
      layer-air-mass gradient, causes the measured column-number residual; the
      sign follows the gradient. The density gradient is NOT the defect -- it is
      ordinary stratification -- and this establishes the INTERACTION of the
      gradient with the missing density ratio, not a fault in the gradient
      (owner §4). Flattening the density profile removes 99.9999% of the
      residual (to below the gamma_n screening scale the mass control uses; see
      the control's own tolerance_basis field for what that scale does and does
      not establish) while surface number outflow
      stays at 96% of the original; inverting the profile flips the sign
      (-0.9896/-0.9919/-1.0032 of the unperturbed residual); doubling the
      contrast doubles it (+2.0117/+2.0091/+2.0407). The departure from exact
      profile scaling is the MEASURED TRAJECTORY TERM (G33-TRAJECTORY-001) and is
      NOT attributed to fall speed or to any single process: density also changes
      the next call's pre-sed state, the cap state, and every density-dependent
      rate. The earlier fall-speed attribution is withdrawn.
    status: active
    evidence_kind: measurement
    run_support: [g33_fixture_multisubcycle_v1]
    artifact_status: pinned
    grade: confirmed
    basis: >
      three-arm falsification test on the forcing, with the mass control holding
      in all four arms and surface outflow as the process-still-running control
    scope: >
      OPERATOR-LEVEL: this is causality under the current den*dz ledger, where
      den is MOIST density, and must NOT be promoted to physical dry-air
      column-number causality -- the physical measure is sum m_d,k n_k
      (owner §10, G33-BASIS-002/003). MAIN chain on
      g33_fixture_multisubcycle_v1, legacy, h = 25 s. LEGACY's ice chain is
      excluded because its mass control fails in every arm (post-update inflow
      cap, G33-ICE-CAP-001) -- a limitation of that cap, not of the mechanism:
      G33-NUMBER-009 replicates the whole matrix on the ice chain using the
      conservative variant, where the control closes. The perturbed profiles are constructed probes, not
      physical atmospheres; this establishes the cause, not the magnitude in a
      forecast.
