  - id: G33-NCMIN-004
    text: >
      The qr difference in the sea column decomposes by named process term,
      against the update the runs actually performed. Accretion is the
      DOMINANT direct arithmetic term; autoconversion is smaller but NOT
      negligible, which CORRECTS the earlier wording "accretion carries it and
      autoconversion does not" -- 13.01% is neither zero nor roundoff (owner
      §4.4).
      .
      The share depends on the measure and both are reported. Summing
      per-level rates with equal weight gives pracw 85.3194% / praut 14.6806%.
      Weighting by column mass gives pracw 86.9882% / praut 13.0118% under
      operator rho_m*dz and the same under physical rho_d*dz -- 1+qv is
      vertically constant on this fixture, so it cancels in the ratio, which is
      measured rather than assumed. The mass-weighted pair is the
      column-integrated statement.
      .
      It CLOSES against the real update. The two runs start from a bit-
      identical qr in all 12 cells, so the pre-state term C_pre is zero and is
      recorded as such rather than relied on; the telescoped terms then sum to
      the actual two-run qr_post difference exactly, in raw f32 words, with a
      gap of 0 in every column. Each leg also replays its own update
      bit-exactly from its own operands, and the emitted cold_gate agrees with
      the temperature-derived branch in every cell.
      .
      SCOPE. This is a SOURCE-ORDER direct arithmetic attribution. F is
      non-linear -- f32 rounding, left-to-right association, a positivity clamp
      -- so the individual per-term contributions depend on the substitution
      order, and this convention is the source's own. It is not a
      path-independent process fraction, not a causal mediation fraction and
      not an adjoint sensitivity. The causal chain praut -> qr -> pracw remains
      UNMEASURED: pracw consumes rain praut produces, so a term can carry the
      arithmetic while another is upstream of it.
      .
      GRADE: confirmed-with-scope (owner priority 7). What closed the HOLD is
      what the HOLD was for -- the five P0-SCI-1 defects, the pre-state
      contribution C_pre, MEASURED zero in all 12 cells rather than assumed,
      and the closure of the telescoped terms against the actual two-run
      qr_post difference in raw f32 words with a gap of 0 in every column.
      .
      What did NOT close is not an unfinished part of this measurement. It is a
      different proposition about a different quantity, and it now has its own
      entry: WHERE the difference first arose is G33-NCMIN-005, and it is open.
      Keeping it inside this claim is what made a measured decomposition read
      as unmeasured. The substitution-order dependence stays HERE, as scope
      rather than as a hold: under the stated convention the decomposition is
      exact, and the convention is the source's own order.
    status: active
    evidence_kind: measurement
    run_support: [g33_fixture_boundary_mapping_v1]
    artifact_status: pinned
    grade: confirmed-with-scope
    basis: >
      source-order f32 direct arithmetic decomposition of the qr update.
      Each leg replays its own update bit-exactly, the two legs share a
      bit-identical pre-state, and the terms close against the actual two-run
      post-state difference in raw f32 words.
    scope: >
      g33_fixture_boundary_mapping_v1, one call, nsplit=1. Operator and
      physical mass weighting are BOTH computed; dtcld is applied; the
      decomposition closes against micro_pre/post_state_update. This scope
      previously said the opposite of all three -- it described the first
      version of the ledger, which the text above had already corrected
      (owner §7.1).
      .
      What the figure IS: a source-order direct arithmetic share on a
      one-call synthetic fixture. What it is NOT, each ruled out for its own
      reason: not a path-independent process fraction, because F is non-linear
      and the split moves with the substitution order; not a causal mediation
      fraction, because pracw consumes the rain praut produces (G33-NCMIN-005);
      not an adjoint sensitivity, because nothing here differentiates the
      operator.
    artifacts:
      - kdm6ad-g33m-migrate/ncmin-001.bundles/9300dd617379610d71a67717020da9abb38a10a42b5ff1719e278c3564cf0072/manifest.json: 9b3138c1363fa8e9eff4a9f1dc53039bd9015bbb01afa129c3568c5a447345c0
