  - id: G33-TURNOVER-002
    text: >
      The f32 fine-step turnover is precision-dependent — it vanishes at f64 and
      the error floor drops 13.7x (th) / 114.7x (qv). Accumulated arithmetic
      roundoff is a strong candidate; active-set change is NOT excluded, because
      the active set 1[g(x_e)>0] depends on the state and the state depends on
      precision. Cause HOLD.
    status: active
    evidence_kind: measurement
    run_support: [g33_fixture_multisubcycle_v1]
    artifact_status: pinned
    # This claim reads `pinned` because two manifests are attached and verify.
    # `pinned` was doing two jobs: "an artifact is attached and verified" and
    # "this claim's numbers are checked against it" (owner §7). Its computed
    # binding status is `none`, from the entries below.
    unbound:
      - figure: the 13.7x (th) and 114.7x (qv) error-floor drops at f64
        why: both pinned bundles carry only `build_provenance.json` and
          `manifest.json` -- no analysis output at all -- so there is no
          artifact field for either ratio to be read from. Binding them needs
          a run that publishes the floors, not a different pin.
    grade: strong-candidate
    basis: measurement
    scope: g33_fixture_multisubcycle_v1, th/qv max-norm, f32 vs f64
    # The RUNS behind the numbers, not only the document quoting them (owner
    # §9.2). A manifest carries every member's output_sha256, so pinning it
    # reaches each raw stream transitively; g33_evidence_chain.py follows that
    # link and verifies the members too. Bundles live outside the repo, so an
    # absent one is `unavailable`, never a failure.
    artifacts:
      - kdm6ad-g33m-refine/full-legacy-dtcld/manifest.json: 86131a0749522295ab7cf7628599890bd15033306e1f69a2d69b7c5f3e8ad362
      - kdm6ad-g33m-refine/fine-legacy-dtcld/manifest.json: 7d7da6020436126755586609ba02f40082865c7f4d55edaef5bef65c445a7701
    evidence: [FINDING_refinement_noise_floor_v1.md,
               FINDING_fixture_precipitates_only_at_f32_v1.md]
    evidence_sha256: [FINDING_refinement_noise_floor_v1.md:9668ccb5870bc1cfbcb61573cdd477c715ea6fa6e7e8bfd1a433d1b08e2731e5, FINDING_fixture_precipitates_only_at_f32_v1.md:3fbb736a5f13206def981358e64b6f201fc3e6434ba05c918a9429855de8490d]

