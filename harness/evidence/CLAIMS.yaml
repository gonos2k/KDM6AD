  - id: G33-TRAJECTORY-001
    text: >
      The density arms' departure from exactly -1 and +2 is decomposed rather
      than attributed: R(rho') = sum drho'*dz*d(rho) [metric] + sum
      drho'*dz*[d(rho')-d(rho)] [trajectory], an identity. The metric term is
      EXACTLY 0/-1/+2 by construction, so the entire departure is the trajectory
      response, measured at 1.04%/0.81% (inverted) and 0.58%/0.45%/2.04% (x2) of
      the metric term. The OFFSET arms separate gradient from magnitude
      directly: adding a constant to every level cancels out of
      (rho_below - rho_above), so a +/-10% absolute density shift leaves the
      metric term at exactly 1.0 (11 of 12 metric ratios bit-exact, the twelfth
      5.8e-7 from f32 roundoff on the offset addition) while a doubled gradient
      puts it at exactly 2.0. The residual follows the GRADIENT; the 2.25-6.68%
      it moves under an offset is trajectory by construction. Stated precisely
      (owner §8): the DIRECT metric source term depends on the gradient only --
      a uniform offset leaves it at exactly 1.0 -- while the TOTAL residual is
      gradient-dominant but measurably magnitude-sensitive THROUGH the
      trajectory, by up to 6.68% here. The stronger form -- that absolute
      density is irrelevant -- is NOT claimed; see the finding, which quotes and
      withdraws it. Interfaces are paired by EXACT KEY
      (call, loop, sub-step, upper, lower), not by count, so a same-count
      different-universe pair is refused rather than mis-paired (owner P0-1).
      The earlier attribution to fall speed alone stays
      withdrawn -- this measures the term's SIZE, not its composition.
      Separately, the control "mstep identical in all four arms" is CORRECTED:
      the test merged calls under keys identical across calls, so it compared
      only the last call. Per call, inverted drops column 3's mstep from 3 to 2
      in call 1, so that column has no interface correspondence and is reported
      not-comparable rather than zipped.
    status: active
    evidence_kind: mixed
    run_support: [g33_fixture_multisubcycle_v1]
    artifact_status: historical_unavailable
    migration_blocker: no figure of this claim was located in either pinned bundle; not yet traced to an analysis that emits them
    grade: confirmed
    basis: >
      an algebraic identity evaluated on six real runs, over an interface
      universe matched by EXACT KEY rather than by count, with the metric term
      verified exact against the profiles' construction. The owner's
      CONDITIONAL grade pending exact interface identity is satisfied by that
      keying; a same-count different-universe pair is now refused.
    scope: >
      g33_fixture_multisubcycle_v1, legacy, main chain, h = 25 s. The trajectory
      term is not further decomposed -- it is everything the perturbation did to
      the run, and its size is measured, not apportioned. The metric
      counterfactual is defined only where the sub-step schedule holds.
    evidence: [FINDING_metric_trajectory_split_v1.md]
    evidence_sha256: [FINDING_metric_trajectory_split_v1.md:add9b27668bf353dbbbc763e271a987500f48ecd4cbae8ce685d3b3799552b69]

