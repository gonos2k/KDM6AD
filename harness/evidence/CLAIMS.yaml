    grade: confirmed
    basis: implementation + regression tests
    scope: G33P schema 2; schema 1 streams are refused
    evidence: [FINDING_fixture_precipitates_only_at_f32_v1.md]
    evidence_sha256: [FINDING_fixture_precipitates_only_at_f32_v1.md:f74dabecb2bd7fe4]

