      It fixes the mass measure and leaves number on the dz ratio. Fixing the cap additionally makes the ice chain measurable --
      ice/qi's control now closes where legacy's failed at -384%/-269% -- giving
      ice/ni +6.2789% and +7.0584%.
    status: active
    grade: confirmed
    basis: measurement with a matched mass control on both arms
    scope: g33_fixture_multisubcycle_v1, h = 25 s, legacy and conservative
    evidence: [FINDING_conservative_number_defect_v1.md]
    evidence_sha256: [FINDING_conservative_number_defect_v1.md:cb71248c8ab262b7]

  - id: G33-NUMBER-008
    text: >
      The number creation is caused by the density gradient, not merely
      correlated with it. Flattening the density profile removes 99.9999% of the
      residual (to below the gamma_n roundoff bound) while surface number outflow
      stays at 96% of the original; inverting the profile flips the sign
      (-0.9896/-0.9919/-1.0032 of the unperturbed residual); doubling the
      contrast doubles it (+2.0117/+2.0091/+2.0407). The 1-4% departures from
      exactly -1 and +2 are the second-order effect of density on the fall speed,
      which the perturbation does not hold fixed.
    status: active
    grade: confirmed
    basis: >
      three-arm falsification test on the forcing, with the mass control holding
      in all four arms and surface outflow as the process-still-running control
    scope: >
      MAIN chain only on g33_fixture_multisubcycle_v1, legacy, h = 25 s. The ice
      chain's mass control fails in every arm (post-update inflow cap,
      G33-ICE-CAP-001), so ice rows are excluded. The perturbed profiles are
      constructed probes, not physical atmospheres; this establishes the cause,
      not the magnitude in a forecast.
    evidence: [FINDING_density_falsification_v1.md]
    evidence_sha256: [FINDING_density_falsification_v1.md:1def794b160c130d]

