  - id: G33-WATER-ORDER-002
    text: >
      The f64 members' final column-water endpoints agree with each other far
      more closely than the f32 members' do -- spread 1.6e-6/2.5e-7/8.8e-7
      against 5.7e-3/7.0e-3/9.6e-3 -- so orders taken on column water at f32 are
      not convergence rates. CORRECTED (owner §12.2): this said "column water is
      near-conserved", which a member-to-member SPREAD cannot establish.
      max_h W_h - min_h W_h ~ 0 means step-INSENSITIVE; conservation is
      W_f - W_i + P_surface ~ 0, a different proposition measured by a different
      quantity. The conservation residual is G33-WATER-CONS-001/002.
    status: active
    evidence_kind: measurement
    run_support: [g33_fixture_multisubcycle_v1]
    artifact_status: historical_unavailable
    blocker_kind: needs-derived-field
    migration_blocker: >
      RECLASSIFIED from needs-f64 (owner priority 9). The f64 multi-member
      sweep this asked for now exists and is pinned by its two sibling
      claims: nine members, h = 100 s down to 0.39 s, published with all nine
      raw streams digested into the bundle. Running it is what showed the
      blocker named the wrong obstacle.
      .
      The figure is a spread ACROSS members and every analysis in the bundle
      is per member, so there is nothing for it to bind to. Searched: the only
      published field whose name contains "spread" is dual_ledger's
      `humidity.N.spread`, which is the within-member range of 1+qv -- a
      different quantity in a different direction. `cross_member_endpoint_spread`
      exists in g33_refine_analyze, but as a REPORT over parsed members rather
      than as a derived field any bundle writes down.
      .
      So the remedy is a bundle-level water-endpoint analysis, the same shape
      as metric_trajectory: one entry per bundle rather than per member, over
      the members already published here. That is an added analysis, which
      re-produces the archive, so it is an owner decision and not a run.
    grade: confirmed
    basis: measurement
    scope: g33_fixture_multisubcycle_v1, f32 vs f64, legacy
    evidence: [FINDING_column_water_orders_v1.md]
    evidence_sha256: [FINDING_column_water_orders_v1.md:9eeaaf4b5d65d51393f613467a7b7fbc0580b4642c15e9a971560e1546226901]

